<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="18%" stop-color="#f59e0b" />
      <stop offset="36%" stop-color="#84cc16" />
      <stop offset="54%" stop-color="#06b6d4" />
      <stop offset="72%" stop-color="#818cf8" />
      <stop offset="90%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blurred" />
      <feMerge>
        <feMergeNode in="blurred" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="6" y="6" width="52" height="52" rx="12" fill="none" stroke="url(#rainbow)" stroke-width="4" filter="url(#glow)" />
  <rect x="10" y="10" width="44" height="44" rx="10" fill="#ffffff" />
  <text x="32" y="40" text-anchor="middle" font-size="24" font-family="Arial, sans-serif" font-weight="800" fill="#0f172a">KB</text>
</svg>
